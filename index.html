<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promofy — Ofertas e Cupons que Valem a Pena</title>
    <meta name="description" data-rh="true" content="Receba ofertas e cupons exclusivos no WhatsApp gratuitamente. Curadoria real, sem spam.">
    <meta name="author" content="Promofy" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta property="og:type" data-rh="true" content="website" />
    <meta property="og:url" data-rh="true" content="https://apromofy.online/" />
    <link rel="canonical" data-rh="true" href="https://apromofy.online/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://www.facebook.com" />
    <link rel="dns-prefetch" href="https://bzrcdn.openai.com" />
    <link rel="dns-prefetch" href="https://bzr.openai.com" />

    <!-- Elemento de LCP da landing. Mora em /public com nome fixo justamente
         para poder ser pré-carregado daqui: asset importado ganha hash no
         build e o nome não existiria na hora de escrever este HTML. -->
    <link rel="preload" as="image" href="/promofy-avatar.jpg" fetchpriority="high" />

    <!-- A Inter agora é servida por este mesmo domínio (ver o @font-face em
         src/index.css). Antes vinha do Google Fonts, o que obrigava o
         navegador a abrir conexão com fonts.googleapis.com, ler o CSS de lá e
         só então abrir uma SEGUNDA conexão com fonts.gstatic.com para buscar
         os arquivos — duas resoluções de DNS e dois handshakes TLS antes da
         primeira letra. Local, é zero conexão nova e um preload direto.
         O `crossorigin` é obrigatório mesmo sendo o mesmo domínio: fonte é
         sempre buscada em modo CORS, e sem ele o preload seria descartado e
         o arquivo baixado duas vezes. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-var.woff2" crossorigin />

    <meta property="og:title" data-rh="true" content="Promofy — Ofertas e Cupons que Valem a Pena">
    <meta name="twitter:title" data-rh="true" content="Promofy — Ofertas e Cupons que Valem a Pena">
    <meta property="og:description" data-rh="true" content="Receba ofertas e cupons exclusivos no WhatsApp gratuitamente. Curadoria real, sem spam.">
    <meta name="twitter:description" data-rh="true" content="Receba ofertas e cupons exclusivos no WhatsApp gratuitamente. Curadoria real, sem spam.">
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/pQ3GHjbnAmh4RBc51EsInzhQegv2/social-images/social-1777444735874-ChatGPT_Image_9_de_fev._de_2026,_01_00_46.webp">
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/pQ3GHjbnAmh4RBc51EsInzhQegv2/social-images/social-1777444735874-ChatGPT_Image_9_de_fev._de_2026,_01_00_46.webp">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Meta Pixel Code (deferred to idle to protect LCP) -->
    <script>
      (function () {
        function loadPixel() {
          if (window.fbq) return;
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', '1561896425355572');
          fbq('track', 'PageView');
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadPixel, { timeout: 3000 });
        } else {
          setTimeout(loadPixel, 2000);
        }
      })();
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1561896425355572&ev=PageView&noscript=1" alt="" /></noscript>

    <!-- Pixel do OpenAI Ads (adiado para o ocioso, igual ao da Meta).
         A instrução da OpenAI pede o script "perto do topo"; adiamos de
         propósito, porque o trecho deles já é um stub com fila: chamadas
         feitas antes do SDK chegar ficam empilhadas em oaiq.q e sobem
         quando ele carrega. Nada se perde, e a renderização não espera.
         O evento de conversão NÃO fica aqui — ele mora em src/lib/lead.ts,
         no mesmo ponto que dispara o Lead da Meta. -->
    <script>
      (function () {
        function loadOaiq() {
          if (window.oaiq) return;
          !function(w,d,s,u){if(w.oaiq)return;var q=function(){q.q.push(arguments)};q.q=[];w.oaiq=q;var j=d.createElement(s);j.async=1;j.src=u;var f=d.getElementsByTagName(s)[0];f.parentNode.insertBefore(j,f)}(window,document,"script","https://bzrcdn.openai.com/sdk/oaiq.min.js");
          // debug liga sozinho só fora do site publicado — nada de lembrar de trocar
          // antes de subir. Em apromofy.online isto é sempre false.
          var emDesenvolvimento = location.hostname === "localhost" || location.hostname === "127.0.0.1";
          oaiq("init", { pixelId: "45eXnE333nLqBeWBfwzcL4", debug: emDesenvolvimento });
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadOaiq, { timeout: 3000 });
        } else {
          setTimeout(loadOaiq, 2000);
        }
      })();
    </script>
  </body>
</html>
