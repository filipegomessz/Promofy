    <!-- A Inter agora é servida por este mesmo domínio (ver o @font-face em
         src/index.css). Antes vinha do Google Fonts, o que obrigava o
         navegador a abrir conexão com fonts.googleapis.com, ler o CSS de lá e
         só então abrir uma SEGUNDA conexão com fonts.gstatic.com para buscar
         os arquivos — duas resoluções de DNS e dois handshakes TLS antes da
         primeira letra. Local, é zero conexão nova e um preload direto.
         O `crossorigin` é obrigatório mesmo sendo o mesmo domínio: fonte é
         sempre buscada em modo CORS, e sem ele o preload seria descartado e
         o arquivo baixado duas vezes. -->

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- =================================================================
         OS DOIS PIXELS (Meta e OpenAI Ads)

         A regra desta seção em uma linha: **a fila existe desde o primeiro
         instante; o SDK pesado chega depois.**

         Os dois SDKs continuam sendo baixados atrasados de propósito, para
         não disputarem banda e processador com a primeira pintura. Mas o
         *stub com fila* de cada um — o objeto `fbq`/`oaiq` que só empilha
         as chamadas — é criado AQUI, de forma síncrona. Custa uma fração
         de kB e nada de rede.

         POR QUE ISSO MUDOU (26/08/2026). Até esta data o stub era criado
         DENTRO da função adiada. Enquanto ela não rodava, `window.fbq` e
         `window.oaiq` não existiam — e o `trackLead` (src/lib/lead.ts)
         checa justamente `typeof window.fbq === "function"` antes de
         disparar. Resultado: quem caísse na página e apertasse o botão do
         WhatsApp antes do respiro do navegador tinha a conversão
         **descartada em silêncio**, nas DUAS plataformas. E é justamente o
         visitante que chega convencido e aperta na hora — o melhor que o
         anúncio compra.

         Ter fila é o modo como as duas plataformas projetaram os próprios
         trechos: o `n.queue` da Meta e o `oaiq.q` da OpenAI existem para
         isto. O que estava errado aqui era só o lugar deles.

         O evento de conversão NÃO fica neste arquivo — ele mora em
         src/lib/lead.ts, num ponto único para as duas plataformas.
         ================================================================= -->
    <script>
      (function () {
        // Lido pelo trackLead só para o log dizer a verdade: com o stub
        // sempre no ar, "o pixel existe" deixou de significar "o SDK
        // recebeu". Ver a régua de honestidade em src/lib/lead.ts.
        var estado = (window.__promofyPixels = { meta: false, openai: false });

        /* -------- 1. Stub da Meta: cria window.fbq com fila ---------- */
        // É o trecho oficial da Meta com UMA subtração: o rabo que criava
        // e inseria o <script> saiu daqui e foi para baixarSdks(), abaixo.
        // O resto — inclusive o `n.queue` — está intacto.
        !function(f,n){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[]}(window);
        fbq('init', '1561896425355572');
        fbq('track', 'PageView');

        /* -------- 2. Stub da OpenAI: cria window.oaiq com fila ------- */
        // Mesma subtração: só o que monta a fila fica aqui.
        !function(w){if(w.oaiq)return;var q=function(){q.q.push(arguments)};q.q=[];w.oaiq=q}(window);
        // debug liga sozinho só fora do site publicado — nada de lembrar de trocar
        // antes de subir. Em apromofy.online isto é sempre false.
        var emDesenvolvimento = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        oaiq("init", { pixelId: "45eXnE333nLqBeWBfwzcL4", debug: emDesenvolvimento });

        /* -------- 3. Aí sim, o material pesado, atrasado ------------- */
        function carregar(url, aoChegar) {
          var j = document.createElement("script");
          j.async = true;
          j.src = url;
          j.onload = aoChegar;
          var primeiro = document.getElementsByTagName("script")[0];
          primeiro.parentNode.insertBefore(j, primeiro);
        }

        var jaBaixou = false;
        function baixarSdks() {
          if (jaBaixou) return;
          jaBaixou = true;
          carregar("https://connect.facebook.net/en_US/fbevents.js", function () {
            estado.meta = true;
          });
          carregar("https://bzrcdn.openai.com/sdk/oaiq.min.js", function () {
            estado.openai = true;
          });
        }

        // Dispara no que vier PRIMEIRO, e uma vez só:
        //
        //  - o primeiro toque na tela, porque é o aviso de que um clique no
        //    botão do WhatsApp vem a caminho. Adiantar o download aqui dá ao
        //    SDK algumas centenas de milissegundos de vantagem sobre os
        //    250 ms que o trackLead segura antes de abrir o WhatsApp;
        //  - o primeiro respiro do navegador, como já era;
        //  - 3 s no relógio — e este é NOVO, é rede de segurança: em aba
        //    oculta o requestIdleCallback pode simplesmente nunca rodar, e
        //    sem este setTimeout até o PageView se perderia. O `jaBaixou`
        //    garante que os três caminhos juntos baixem uma vez só.
        //
        // Nada disto pesa no PageSpeed: o Lighthouse não toca na tela, então
        // para ele continua valendo o caminho do ocioso, igual a antes.
        document.addEventListener("pointerdown", baixarSdks, { capture: true, once: true, passive: true });
        if ("requestIdleCallback" in window) requestIdleCallback(baixarSdks, { timeout: 3000 });
        window.setTimeout(baixarSdks, 3000);
      })();
    </script>
