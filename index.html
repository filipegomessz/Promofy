    <!-- Elemento de LCP da landing. Mora em /public com nome fixo justamente
         para poder ser pré-carregado daqui: asset importado ganha hash no
         build e o nome não existiria na hora de escrever este HTML. -->
    <link rel="preload" as="image" href="/promofy-avatar.jpg" fetchpriority="high" />

    <!-- A Inter agora é servida por este mesmo domínio (ver o @font-face em
         src/index.css). Antes vinha do Google Fonts, o que obrigava o
         navegador a abrir conexão com fonts.googleapis.com, ler o CSS de lá e
         só então abrir uma SEGUNDA conexão com fonts.gstatic.com para buscar
         os arquivos — duas resoluções de DNS e dois handshakes TLS antes da
         primeira letra. Local, é zero conexão nova e um preload direto.
         O `crossorigin` é obrigatório mesmo sendo o mesmo domínio: fonte é
         sempre buscada em modo CORS, e sem ele o preload seria descartado e
         o arquivo baixado duas vezes. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-var.woff2" crossorigin />

    <meta property="og:title" data-rh="true" content="Promofy — Ofertas e Cupons que Valem a Pena">
    <meta name="twitter:title" data-rh="true" content="Promofy — Ofertas e Cupons que Valem a Pena">
    <meta property="og:description" data-rh="true" content="Receba ofertas e cupons exclusivos no WhatsApp gratuitamente. Curadoria real, sem spam.">
    <meta name="twitter:description" data-rh="true" content="Receba ofertas e cupons exclusivos no WhatsApp gratuitamente. Curadoria real, sem spam.">
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/pQ3GHjbnAmh4RBc51EsInzhQegv2/social-images/social-1777444735874-ChatGPT_Image_9_de_fev._de_2026,_01_00_46.webp">
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/pQ3GHjbnAmh4RBc51EsInzhQegv2/social-images/social-1777444735874-ChatGPT_Image_9_de_fev._de_2026,_01_00_46.webp">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- OS DOIS PIXELS. Regra: a fila existe desde o primeiro instante, o SDK
         pesado chega depois. Comentário aqui é curto DE PROPÓSITO — o Vite não
         minifica script inline, então tudo que se escreve neste bloco viaja em
         cada página. O porquê inteiro está em src/lib/lead.ts, que é
         compilado e onde comentário sai de graça. -->
    <script>
      (function () {
        var estado = (window.__promofyPixels = { meta: false, openai: false });

        /* 1. Stub da Meta — trecho oficial menos o rabo que inseria o <script>. */
        !function(f,n){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[]}(window);
        fbq('init', '1561896425355572');
        fbq('track', 'PageView');

        /* 2. Stub da OpenAI — mesma subtração. */
        !function(w){if(w.oaiq)return;var q=function(){q.q.push(arguments)};q.q=[];w.oaiq=q}(window);
        // debug liga sozinho fora do site publicado; em apromofy.online é sempre false.
        var emDesenvolvimento = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        oaiq("init", { pixelId: "45eXnE333nLqBeWBfwzcL4", debug: emDesenvolvimento });

        /* 3. Aí sim, o material pesado — atrasado. */
        function carregar(url, aoChegar) {
          var j = document.createElement("script");
          j.async = true;
          j.src = url;
          j.onload = aoChegar;
          var primeiro = document.getElementsByTagName("script")[0];
          primeiro.parentNode.insertBefore(j, primeiro);
        }

        var jaBaixou = false;
        function baixarSdks() {
          if (jaBaixou) return;
          jaBaixou = true;
          carregar("https://connect.facebook.net/en_US/fbevents.js", function () {
            estado.meta = true;
          });
          carregar("https://bzrcdn.openai.com/sdk/oaiq.min.js", function () {
            estado.openai = true;
          });
        }

        // Veio de anúncio da OpenAI? Então NADA de adiar: a URL traz ?oppref=,
        // que é o que liga a conversão à campanha, e o SDK só o captura quando
        // carrega. Atribuição não pode depender de adiamento de performance.
        // Não custa PageSpeed: medição nenhuma chega com oppref na URL.
        if (location.search.indexOf("oppref=") !== -1) baixarSdks();

        // Para todo o resto: toque, ocioso ou 3 s — o que vier primeiro;
        // `jaBaixou` garante uma vez só. O porquê está em src/lib/lead.ts.
        document.addEventListener("pointerdown", baixarSdks, { capture: true, once: true, passive: true });
        if ("requestIdleCallback" in window) requestIdleCallback(baixarSdks, { timeout: 3000 });
        window.setTimeout(baixarSdks, 3000);
      })();
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1561896425355572&ev=PageView&noscript=1" alt="" /></noscript>
  </body>
